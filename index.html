<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09131d">
<title>Neon Road Rally</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;min-height:100dvh;padding:10px;background:radial-gradient(ellipse at 50% -15%,#24475a,#101723 50%,#080d15);color:#f7fbff}
.game{width:min(100%,960px);margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
h1{margin:0;font-size:clamp(20px,5vw,31px);font-weight:950;letter-spacing:.04em}
h1 span{color:#62e9db}
.tag{color:#a9c3d2;font-size:10px;font-weight:750;letter-spacing:.14em;text-align:right}
.arena{position:relative;overflow:hidden;border:1px solid #78f0dc33;border-radius:18px;background:#0b1720;box-shadow:0 16px 60px #0009,0 0 34px #35dfcb11}
canvas{display:block;width:100%;height:auto;aspect-ratio:900/440;touch-action:none}
.hud{position:absolute;top:10px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}
.hud-player{min-width:0}
.hud-name{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:4px;font-size:11px;font-weight:900;letter-spacing:.05em;text-shadow:0 2px 8px #000}
.hud-name.right{flex-direction:row-reverse}
.distance{color:#8affdd;font-size:11px;font-variant-numeric:tabular-nums}
.distance.right{color:#ff9aa8}
.progress{height:8px;overflow:hidden;border:1px solid #ffffff42;border-radius:10px;background:#111528d9}
.progress i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#21cba9,#b2ff71);box-shadow:0 0 10px #64ffbd}
.progress.right i{margin-left:auto;background:linear-gradient(90deg,#ffc466,#ff507b);box-shadow:0 0 10px #ff6684}
.timer{min-width:48px;padding:4px 6px;text-align:center;border:1px solid #ffffff2b;border-radius:11px;background:#0a111bd9;color:#fff;font-size:17px;font-weight:950;font-variant-numeric:tabular-nums}
.message{position:absolute;top:47%;left:0;right:0;transform:translateY(-50%);text-align:center;color:#fff;font-size:clamp(23px,7vw,45px);font-weight:1000;letter-spacing:.08em;text-shadow:0 0 12px #fff,0 0 25px #40eed4,0 5px 20px #000;pointer-events:none}
.message small{display:block;margin-top:5px;color:#e0f1f4;font-size:11px;font-weight:650;letter-spacing:.04em;text-shadow:0 2px 8px #000}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}
.upload{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 9px;border:1px solid #ffffff1d;border-radius:12px;background:linear-gradient(130deg,#182b36,#111923)}
.preview{width:35px;height:35px;flex:none;border:1px solid #69f5d877;border-radius:10px;object-fit:cover;background:linear-gradient(145deg,#36a79e,#4a6de0)}
.upload label{min-width:0;flex:1;color:#dce9ed;font-size:10px}
.upload strong{display:block;margin-bottom:2px;color:#fff;font-size:11px}
.upload input{display:block;width:100%;max-width:100%;font-size:9px;color:#aeb8c9}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{min-width:0;padding:8px;border:1px solid #ffffff20;border-radius:14px;background:linear-gradient(145deg,#172a35,#101923);box-shadow:0 5px 18px #0004}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px;font-size:11px;font-weight:950;letter-spacing:.06em}
.panel-title .p1{color:#70f5dc}
.panel-title .p2{color:#ff9baa}
.panel-title small{color:#9eb4c1;font-size:9px;font-weight:600;letter-spacing:0}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
button{min-width:0;min-height:50px;padding:3px;border:1px solid #ffffff22;border-radius:11px;background:linear-gradient(180deg,#29404d,#1a2934);color:#fff;font:800 10px system-ui;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 0 #080a12;cursor:pointer}
button:active,button.down{transform:translateY(2px);background:#3e6670;box-shadow:0 1px 0 #080a12}
button.boost{grid-column:span 3;border-color:#ffe28b77;background:linear-gradient(140deg,#a56b14,#e8a92e);color:#18120a}
.fuel{height:4px;margin:3px 8px 0;overflow:hidden;border-radius:8px;background:#493b22}
.fuel i{display:block;width:100%;height:100%;background:#ffe68a}
.icon{display:block;font-size:16px;line-height:18px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;color:#a9c3d2;font-size:10px}
.footer button{min-height:34px;padding:4px 12px;font-size:10px}
@media(max-width:420px){
body{padding:7px}
header{margin-bottom:7px}
.tag{max-width:115px;font-size:8px;letter-spacing:.1em}
.hud{top:8px;left:8px;right:8px;gap:6px}
.hud-name{font-size:9px;margin-bottom:3px}
.distance{font-size:9px}
.progress{height:7px}
.timer{min-width:40px;padding:3px 4px;font-size:14px}
.uploads{gap:5px;margin:7px 0}
.upload{gap:5px;padding:6px}
.preview{width:29px;height:29px}
.upload strong{font-size:10px}
.upload input{font-size:8px}
.panels{gap:5px}
.panel{padding:6px}
.panel-title{font-size:10px;margin-bottom:5px}
.buttons{gap:4px}
button{min-height:44px;border-radius:9px;font-size:9px}
.icon{font-size:14px;line-height:16px}
.footer{font-size:9px}
.footer button{min-height:32px}
}
@media(orientation:landscape) and (max-height:600px){
body{width:100%;height:100vh;height:100dvh;min-height:0;padding:0;overflow:hidden}
.game{position:relative;width:100%;height:100vh;height:100dvh;max-width:none;margin:0;overflow:hidden}
header{position:absolute;z-index:3;top:5px;left:9px;right:9px;margin:0;pointer-events:none}
h1{font-size:14px;letter-spacing:.03em}
.tag{font-size:8px;letter-spacing:.08em}
.arena{position:absolute;z-index:0;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
canvas{width:100%;height:100%;aspect-ratio:auto}
.hud{top:5px;left:29%;right:29%;gap:5px}
.hud-name{font-size:9px;margin-bottom:3px}
.distance{font-size:9px}
.progress{height:7px}
.timer{min-width:42px;padding:3px 4px;font-size:12px}
.message{top:43%;font-size:clamp(22px,6vh,40px)}
.message small{font-size:10px}
.uploads{position:absolute;z-index:4;top:35px;left:8px;right:8px;grid-template-columns:1fr 1fr;gap:6px;margin:0;pointer-events:none}
.upload{width:min(34vw,210px);min-height:34px;padding:4px 6px;background:#0c1825d9;backdrop-filter:blur(5px);pointer-events:auto}
.upload:first-child{justify-self:start}
.upload:last-child{justify-self:end}
.preview{width:26px;height:26px}
.upload label{font-size:8px}
.upload strong{font-size:9px}
.upload input{font-size:8px}
.panels{position:absolute;z-index:4;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:0;pointer-events:none}
.panel{width:min(39vw,360px);padding:5px;background:#0d1927d9;backdrop-filter:blur(5px);pointer-events:auto}
.panel:first-child{justify-self:start;margin-left:7px}
.panel:last-child{justify-self:end;margin-right:7px}
.panel-title{margin-bottom:3px;font-size:9px}
.panel-title small{font-size:8px}
.buttons{gap:4px}
button{min-height:37px;font-size:9px}
.icon{font-size:13px;line-height:14px}
.footer{display:none}
}
@media(orientation:landscape) and (max-height:380px){
.uploads{top:29px}
.upload{min-height:29px}
.preview{width:22px;height:22px}
.panel{padding:4px}
button{min-height:33px}
}
</style>
</head>
<body>
<main class="game">
<header>
<h1>NEON <span>ROAD RALLY</span></h1>
<div class="tag">TWO PLAYERS · SAME PHONE</div>
</header>

<section class="arena">
<canvas id="track" width="900" height="440" aria-label="Two-player racing game"></canvas>
<div class="hud">
<div class="hud-player">
<div class="hud-name"><span>PLAYER 1</span><span class="distance" id="leftDistance">0 m</span></div>
<div class="progress"><i id="leftProgress"></i></div>
</div>
<div class="timer" id="timer">75</div>
<div class="hud-player">
<div class="hud-name right"><span>PLAYER 2</span><span class="distance right" id="rightDistance">0 m</span></div>
<div class="progress right"><i id="rightProgress"></i></div>
</div>
</div>
<div class="message" id="message">READY?<small>Tap a control to start · First to 1500 m wins</small></div>
</section>

<section class="uploads">
<div class="upload">
<img class="preview" id="leftPreview" alt="Player 1 car">
<label><strong>Player 1 car photo</strong><input id="leftFile" type="file" accept="image/*"></label>
</div>
<div class="upload">
<img class="preview" id="rightPreview" alt="Player 2 car">
<label><strong>Player 2 car photo</strong><input id="rightFile" type="file" accept="image/*"></label>
</div>
</section>

<section class="panels">
<div class="panel">
<div class="panel-title"><span class="p1">◆ PLAYER 1</span><small>LEFT ROAD</small></div>
<div class="buttons">
<button data-player="left" data-action="left" aria-label="Player 1 steer left"><span class="icon">←</span>LEFT</button>
<button data-player="left" data-action="right" aria-label="Player 1 steer right"><span class="icon">→</span>RIGHT</button>
<button data-player="left" data-action="boost" class="boost" aria-label="Player 1 nitro"><span class="icon">⚡</span>NITRO<small class="fuel"><i id="leftFuel"></i></small></button>
</div>
</div>
<div class="panel">
<div class="panel-title"><span class="p2">◆ PLAYER 2</span><small>RIGHT ROAD</small></div>
<div class="buttons">
<button data-player="right" data-action="left" aria-label="Player 2 steer left"><span class="icon">←</span>LEFT</button>
<button data-player="right" data-action="right" aria-label="Player 2 steer right"><span class="icon">→</span>RIGHT</button>
<button data-player="right" data-action="boost" class="boost" aria-label="Player 2 nitro"><span class="icon">⚡</span>NITRO<small class="fuel"><i id="rightFuel"></i></small></button>
</div>
</div>
</section>

<div class="footer">
<span>Tap LEFT/RIGHT to dodge traffic · Hold NITRO to boost</span>
<button id="restart">NEW RACE</button>
</div>
</main>
<script>
const canvas=document.getElementById("track");
const ctx=canvas.getContext("2d");
const get=id=>document.getElementById(id);
const finishDistance=1500;
const carY=300;
const roadLeft=[32,468];
const roadWidth=400;
const players={
left:{lane:1,progress:0,fuel:100,penalty:0,steerWait:0,flash:0,glow:"#62ffe0"},
right:{lane:1,progress:0,fuel:100,penalty:0,steerWait:0,flash:0,glow:"#ff7895"}
};
const images={left:null,right:null};
const held={left:{},right:{}};
const traffic={left:[],right:[]};
const spawnWait={left:300,right:650};
let state="ready",remaining=75,roadOffset=0,last=performance.now(),elapsed=0,messageTimer=0;
function resize(){
const rect=canvas.getBoundingClientRect();
const ratio=Math.min(devicePixelRatio||1,2);
canvas.width=Math.max(1,Math.round(rect.width*ratio));
canvas.height=Math.max(1,Math.round(rect.height*ratio));
ctx.setTransform(canvas.width/900,0,0,canvas.height/440,0,0)
}
new ResizeObserver(resize).observe(canvas);
function loadImage(input,side){
input.addEventListener("change",()=>{
const file=input.files&&input.files[0];
if(!file)return;
const url=URL.createObjectURL(file);
const image=new Image();
image.onload=()=>{images[side]=image;get(side+"Preview").src=url};
image.src=url
})
}
loadImage(get("leftFile"),"left");
loadImage(get("rightFile"),"right");
function say(title,sub="",duration=1200){
get("message").innerHTML=title+(sub?"<small>"+sub+"</small>":"");
messageTimer=duration
}
function begin(){
if(state==="ready"){
state="playing";
say("GO!","Dodge traffic and race to 1500 m",1400)
}
}
function resetRace(){
for(const side of ["left","right"]){
players[side].lane=1;
players[side].progress=0;
players[side].fuel=100;
players[side].penalty=0;
players[side].steerWait=0;
players[side].flash=0;
traffic[side]=[];
spawnWait[side]=side==="left"?300:650;
held[side]={};
get(side+"Progress").style.width="0%";
get(side+"Distance").textContent="0 m";
get(side+"Fuel").style.width="100%"
}
state="ready";
remaining=75;
roadOffset=0;
get("timer").textContent="75";
say("READY?","Tap a control to start · First to 1500 m wins",100000)
}
function finish(winner){
if(state!=="playing")return;
state="over";
say(winner==="left"?"PLAYER 1 WINS!":"PLAYER 2 WINS!","Tap NEW RACE to play again",100000)
}
function steer(side,direction){
begin();
if(state!=="playing")return;
const p=players[side];
if(p.steerWait>0)return;
p.lane=Math.max(0,Math.min(2,p.lane+direction));
p.steerWait=180
}
function spawnTraffic(side){
const lane=Math.floor(Math.random()*3);
const type=Math.random()<.72?"car":"cone";
traffic[side].push({lane,y:-55,type,color:["#ffba57","#8c80ff","#fd6f8e","#59d7ff"][Math.floor(Math.random()*4)],hit:false})
}
function action(side,what){
if(state==="over")return;
begin();
if(what==="left")steer(side,-1);
if(what==="right")steer(side,1)
}
function bindButton(button){
const side=button.dataset.player;
const what=button.dataset.action;
const release=()=>{
button.classList.remove("down");
if(what==="boost")held[side].boost=false
};
button.addEventListener("pointerdown",event=>{
event.preventDefault();
button.classList.add("down");
try{button.setPointerCapture(event.pointerId)}catch{}
if(state==="over")return;
begin();
if(what==="boost")held[side].boost=true;
else action(side,what)
});
button.addEventListener("pointerup",release);
button.addEventListener("pointercancel",release);
button.addEventListener("lostpointercapture",release)
}
document.querySelectorAll("[data-player][data-action]").forEach(bindButton);
const keys={
KeyA:["left","left"],KeyD:["left","right"],ShiftLeft:["left","boost"],
ArrowLeft:["right","left"],ArrowRight:["right","right"],Numpad0:["right","boost"]
};
window.addEventListener("keydown",event=>{
const entry=keys[event.code];
if(!entry)return;
event.preventDefault();
const [side,what]=entry;
begin();
if(what==="boost")held[side].boost=true;
else if(!event.repeat)action(side,what)
});
window.addEventListener("keyup",event=>{
const entry=keys[event.code];
if(entry&&entry[1]==="boost")held[entry[0]].boost=false
});
window.addEventListener("blur",()=>{held.left={};held.right={}});
get("restart").addEventListener("click",resetRace);
function roundRect(x,y,w,h,r){
const q=Math.min(r,w/2,h/2);
ctx.beginPath();
ctx.moveTo(x+q,y);
ctx.arcTo(x+w,y,x+w,y+h,q);
ctx.arcTo(x+w,y+h,x,y+h,q);
ctx.arcTo(x,y+h,x,y,q);
ctx.arcTo(x,y,x+w,y,q);
ctx.closePath()
}
function laneX(side,lane){
return roadLeft[side==="left"?0:1]+(lane+.5)*(roadWidth/3)
}
function drawRoad(side,index){
const x=roadLeft[index];
ctx.fillStyle="#101c1d";
ctx.fillRect(x-9,0,roadWidth+18,440);
ctx.fillStyle="#353b42";
ctx.fillRect(x,0,roadWidth,440);
const roadGrad=ctx.createLinearGradient(x,0,x+roadWidth,0);
roadGrad.addColorStop(0,"#292e36");
roadGrad.addColorStop(.5,"#373b43");
roadGrad.addColorStop(1,"#292e36");
ctx.fillStyle=roadGrad;
ctx.fillRect(x+8,0,roadWidth-16,440);
ctx.fillStyle="#e4e7e6";
for(let y=-70+(roadOffset%76);y<460;y+=76){
ctx.fillRect(x+6,y,4,38);
ctx.fillRect(x+roadWidth-10,y,4,38)
}
ctx.strokeStyle="#ffffff91";
ctx.lineWidth=3;
ctx.setLineDash([25,22]);
ctx.lineDashOffset=-roadOffset;
ctx.beginPath();
ctx.moveTo(x+roadWidth/3,0);ctx.lineTo(x+roadWidth/3,440);
ctx.moveTo(x+roadWidth*2/3,0);ctx.lineTo(x+roadWidth*2/3,440);
ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle="#152a20";
for(let y=-40+(roadOffset%95);y<460;y+=95){
ctx.beginPath();ctx.arc(x-18,y,5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x+roadWidth+18,y+45,5,0,Math.PI*2);ctx.fill()
}
}
function drawBackground(){
const bg=ctx.createLinearGradient(0,0,0,440);
bg.addColorStop(0,"#102332");
bg.addColorStop(1,"#08120f");
ctx.fillStyle=bg;
ctx.fillRect(0,0,900,440);
drawRoad("left",0);
drawRoad("right",1);
const divider=ctx.createLinearGradient(430,0,470,0);
divider.addColorStop(0,"#243a3b");
divider.addColorStop(.5,"#11212a");
divider.addColorStop(1,"#243a3b");
ctx.fillStyle=divider;
ctx.fillRect(432,0,36,440);
ctx.fillStyle="#74fff0";
ctx.shadowColor="#74fff0";
ctx.shadowBlur=12;
ctx.fillRect(449,0,2,440);
ctx.shadowBlur=0;
for(let i=0;i<12;i++){
const y=(i*48+roadOffset*1.25)%460-30;
ctx.fillStyle="#d8fff522";
ctx.fillRect(448,y,4,20)
}
}
function drawCar(x,y,color,image,isPlayer){
ctx.save();
ctx.translate(x,y);
if(isPlayer){
ctx.shadowColor=color;
ctx.shadowBlur=18;
ctx.fillStyle=color+"55";
roundRect(-24,-38,48,76,13);
ctx.fill();
ctx.shadowBlur=0
}
ctx.fillStyle="#080b10";
roundRect(-27,-27,8,20,3);ctx.fill();
roundRect(19,-27,8,20,3);ctx.fill();
roundRect(-27,13,8,20,3);ctx.fill();
roundRect(19,13,8,20,3);ctx.fill();
const paint=ctx.createLinearGradient(-20,-34,20,32);
paint.addColorStop(0,color);
paint.addColorStop(.5,isPlayer?"#eafcff":color);
paint.addColorStop(1,color);
ctx.fillStyle=paint;
roundRect(-21,-38,42,76,12);ctx.fill();
if(image){
ctx.save();
roundRect(-16,-24,32,47,8);
ctx.clip();
ctx.drawImage(image,-16,-24,32,47);
ctx.restore();
ctx.fillStyle="#162533bb";
roundRect(-15,-23,30,19,5);ctx.fill()
}else{
ctx.fillStyle="#14212e";
roundRect(-15,-23,30,18,5);ctx.fill();
ctx.fillStyle="#9de8e8";
roundRect(-13,-21,26,12,4);ctx.fill();
ctx.fillStyle="#17303b";
roundRect(-14,4,28,14,4);ctx.fill()
}
ctx.fillStyle="#fff7b3";
ctx.fillRect(-16,-35,8,4);
ctx.fillRect(8,-35,8,4);
ctx.fillStyle="#ff525b";
ctx.fillRect(-16,31,8,4);
ctx.fillRect(8,31,8,4);
ctx.fillStyle="#ffffffbb";
ctx.fillRect(-2,-34,4,7);
ctx.restore()
}
function drawTraffic(side){
const x0=roadLeft[side==="left"?0:1];
for(const object of traffic[side]){
const x=laneX(side,object.lane);
if(object.type==="car")drawCar(x,object.y,object.color,null,false);
else{
ctx.save();
ctx.translate(x,object.y);
ctx.fillStyle="#ffb33d";
ctx.shadowColor="#ffb33d";
ctx.shadowBlur=10;
ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,17);ctx.lineTo(-15,17);ctx.closePath();ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle="#fff0ba";
ctx.fillRect(-7,7,14,4);
ctx.restore()
}
}
}
function drawPlayer(side){
const x=laneX(side,players[side].lane);
if(players[side].flash>0&&Math.floor(players[side].flash/70)%2===0)ctx.globalAlpha=.35;
drawCar(x,carY,players[side].glow,images[side],true);
ctx.globalAlpha=1
}
function update(dt){
const step=dt/16.67;
if(state==="playing"){
remaining=Math.max(0,remaining-dt/1000);
get("timer").textContent=Math.ceil(remaining);
roadOffset=(roadOffset+5*step)%76;
for(const side of ["left","right"]){
const p=players[side];
p.steerWait=Math.max(0,p.steerWait-dt);
p.flash=Math.max(0,p.flash-dt);
let speed=6;
if(p.penalty>0){p.penalty=Math.max(0,p.penalty-dt);speed=2.5}
else if(held[side].boost&&p.fuel>0){
speed=9.5;
p.fuel=Math.max(0,p.fuel-dt*.027)
}else{
p.fuel=Math.min(100,p.fuel+dt*.009)
}
p.progress+=speed*dt*.01;
get(side+"Progress").style.width=Math.min(100,p.progress/finishDistance*100)+"%";
get(side+"Distance").textContent=Math.floor(p.progress)+" m";
get(side+"Fuel").style.width=p.fuel+"%";
spawnWait[side]-=dt;
if(spawnWait[side]<=0){
spawnTraffic(side);
spawnWait[side]=680+Math.random()*480
}
for(let i=traffic[side].length-1;i>=0;i--){
const object=traffic[side][i];
const previousY=object.y;
object.y+=speed*.8*step+2.2*step;
if(!object.hit&&object.lane===p.lane&&previousY<carY+28&&object.y>=carY-28){
object.hit=true;
p.penalty=1050;
p.progress=Math.max(0,p.progress-35);
p.flash=650
}
if(object.y>490)traffic[side].splice(i,1)
}
if(p.progress>=finishDistance){finish(side);break}
}
if(remaining<=0&&state==="playing")finish(players.left.progress>=players.right.progress?"left":"right")
}
if(messageTimer>0){
messageTimer-=dt;
if(messageTimer<=0&&state==="playing")get("message").innerHTML=""
}
}
function draw(){
drawBackground();
drawTraffic("left");
drawTraffic("right");
drawPlayer("left");
drawPlayer("right")
}
function loop(now){
const dt=Math.min(40,now-last);
last=now;
update(dt);
draw();
requestAnimationFrame(loop)
}
get("restart").addEventListener("click",resetRace);
resize();
requestAnimationFrame(loop);
</script>
</body>
